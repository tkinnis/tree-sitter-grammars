# Builds the Linux archive of a release from the draft's own assets and
# attaches it to the draft. The owner dispatches it with the release's tag
# once `--publish` has created the draft on macOS; `--finalize` publishes
# the draft afterwards, on macOS.
#
# The token of each job holds only what the job needs. The build and attach
# jobs hold contents: write because a draft release is visible only to a
# token that can write; the attest job holds the permissions the
# attestation needs and nothing that can change a release.
name: archives

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag of the draft, vX.Y.Z
        required: true
        type: string
      platform:
        description: The platform to build and attach
        required: true
        type: choice
        options:
          - linux-arm64
        default: linux-arm64

permissions: {}

concurrency:
  group: archives-${{ inputs.tag }}-${{ inputs.platform }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  PLATFORM: ${{ inputs.platform }}
  # The glibc of ubuntu-24.04: the archive needs no later one.
  GLIBC_BUILD_HOST: glibc 2.39
  DART_SDK_VERSION: 3.13.5
  DART_SDK_SHA256: 19a731647c3ed55058ee46dde00330150e6a8729bb6121b4a31e86084c8a3e6d

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Validate the tag and the platform
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "tag must be vX.Y.Z" >&2; exit 1; }
          test "$PLATFORM" = linux-arm64 \
            || { echo "unsupported platform" >&2; exit 1; }

      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Fetch the annotated tag object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          value="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$value"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $value"
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git cat-file -t "refs/tags/$TAG")" = tag \
            || { echo "$TAG is not an annotated tag" >&2; exit 1; }
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)" \
            || { echo "HEAD is not $TAG" >&2; exit 1; }

      - name: Install clang 18 and check the toolchain
        run: |
          # The package version is recorded below; the major version and
          # the glibc are asserted.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          dpkg-query -W clang-18
          clang --version | head -n 1 | grep -Eq 'clang version 18\.' \
            || { echo "expected clang 18" >&2; exit 1; }
          test "$(getconf GNU_LIBC_VERSION)" = "$GLIBC_BUILD_HOST" \
            || { echo "expected $GLIBC_BUILD_HOST" >&2; exit 1; }

      # The repository allows GitHub-owned actions only, so the Dart SDK is
      # downloaded from Google's archive and checked against its pinned
      # digest before it is unpacked.
      - name: Install the pinned Dart SDK
        run: |
          url="https://storage.googleapis.com/dart-archive/channels/stable/release/$DART_SDK_VERSION/sdk/dartsdk-linux-arm64-release.zip"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/dartsdk.zip" "$url"
          echo "$DART_SDK_SHA256  $RUNNER_TEMP/dartsdk.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/dartsdk.zip" -d "$RUNNER_TEMP/dart-sdk"
          echo "$RUNNER_TEMP/dart-sdk/dart-sdk/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/dart-sdk/dart-sdk/bin:$PATH"
          dart --version 2>&1 \
            | grep -Fq "Dart SDK version: $DART_SDK_VERSION " \
            || { echo "expected Dart $DART_SDK_VERSION" >&2; exit 1; }

      - run: dart pub get

      - name: Download the draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/sources"

      - name: Build the archive from the draft's assets
        run: |
          dart run tool/build_tree_sitter_grammars.dart \
            --release="$TAG" --sources="$RUNNER_TEMP/sources"

      - name: Assert the glibc the libraries need
        run: |
          need="$(jq -r .glibcRequirement output/build_info.json)"
          have="${GLIBC_BUILD_HOST#glibc }"
          test -n "$need" && test "$need" != null
          test "$(printf '%s\n%s\n' "$need" "$have" | sort -V | tail -n 1)" = "$have" \
            || { echo "glibcRequirement $need exceeds $have" >&2; exit 1; }

      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archive-linux-arm64
          path: |
            output/grammars-linux-arm64.tar.gz
            output/grammars-linux-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: archive-linux-arm64
          path: archive

      # actions/attest v4.2.2
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: archive/grammars-linux-arm64.tar.gz

  attach:
    needs: [build, attest]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Validate the tag
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "tag must be vX.Y.Z" >&2; exit 1; }

      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Fetch the annotated tag object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          value="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$value"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $value"
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git cat-file -t "refs/tags/$TAG")" = tag \
            || { echo "$TAG is not an annotated tag" >&2; exit 1; }
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)" \
            || { echo "HEAD is not $TAG" >&2; exit 1; }

      # The repository allows GitHub-owned actions only, so the Dart SDK is
      # downloaded from Google's archive and checked against its pinned
      # digest before it is unpacked.
      - name: Install the pinned Dart SDK
        run: |
          url="https://storage.googleapis.com/dart-archive/channels/stable/release/$DART_SDK_VERSION/sdk/dartsdk-linux-arm64-release.zip"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/dartsdk.zip" "$url"
          echo "$DART_SDK_SHA256  $RUNNER_TEMP/dartsdk.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/dartsdk.zip" -d "$RUNNER_TEMP/dart-sdk"
          echo "$RUNNER_TEMP/dart-sdk/dart-sdk/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/dart-sdk/dart-sdk/bin:$PATH"
          dart --version 2>&1 \
            | grep -Fq "Dart SDK version: $DART_SDK_VERSION " \
            || { echo "expected Dart $DART_SDK_VERSION" >&2; exit 1; }

      - run: dart pub get

      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: archive-linux-arm64
          path: built

      - name: Attach the archive to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dart run tool/build_tree_sitter_grammars.dart \
            --release="$TAG" --attach-built="$PWD/built"
